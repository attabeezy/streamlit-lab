[project]
name = "human-resource-classifier"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "shap",
    "numba>=0.65.1",
    "streamlit==1.40.1",
    "xgboost",
]

[dependency-groups]
dev = ["jupyterlab"]

[tool.uv]
package = false
